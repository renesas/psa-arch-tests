// Renesas RA family (RA4/RA6/RA8) on the TF-M ports in trusted-firmware-m under
// platform/ext/target/renesas/. Nothing in this target is device-specific - the UART
// and watchdog entries are unused, and nvmem is supplied at runtime - so one directory
// serves every RA device whose TF-M port logs through tfm_log_printf.
//
// Verified on: RA6E1 (R7FA6E10F2CFP), TF-M v2.2, isolation 3 + IPC backend.
//
// Select it with -DPSA_API_TEST_TARGET=renesas_ra; tests_psa_arch derives the target
// from the platform basename otherwise, which would look for tgt_dev_apis_tfm_<device>.

// UART device info.
//
// Unused, deliberately. This port's console is SEGGER RTT, not a UART: the TF-M platform
// sets <PORT>_STDOUT_RTT and routes the non-secure side through syscalls_ns.c's _write().
// pal_print_ns() therefore goes through tfm_log_printf() and never touches these values,
// exactly as the nRF targets do.
uart.num=1;
uart.0.base = 0; // Unused value

// Watchdog device info.
//
// Also unused. RA devices have a WDT, but nothing here drives it - pal_wd_timer_*_ns() are
// stubs, so a test that hangs hangs until the operator intervenes rather than being
// recovered by a watchdog reset. See the note in nspe/pal_driver_intf.c.
watchdog.num = 1;
watchdog.0.base = 0; // Unused value
watchdog.0.num_of_tick_per_micro_sec = 1;
watchdog.0.timeout_in_micro_sec_low    = 500000000;
watchdog.0.timeout_in_micro_sec_medium = 500000000;
watchdog.0.timeout_in_micro_sec_high   = 500000000;
watchdog.0.timeout_in_micro_sec_crypto = 500000000;

// Range of 1KB non-volatile memory to preserve data over reset.
//
// The base is supplied at runtime by pal_nvmem_get_addr(), so 0 here. Read the caveat in
// nspe/pal_driver_intf.c before using a suite that reboots: this is currently backed by
// non-secure SRAM and does NOT survive a reset.
nvmem.num = 1;
nvmem.0.start = 0; // Unused value
nvmem.0.end = 0x3ff;

// NO dut.* section. val/common/val_target.h in this release maps only UART, TIMER,
// WATCHDOG, NVMEM and the three *_MMIO components to a group; targetConfigGen.py looks
// every "<name>.num" up in that map and dies with KeyError: 'DUT' on anything else - a
// failure it then reports as "Cannot open input file <target.cfg>", which is not what
// happened. tgt_dev_apis_tfm_stm32l562e_dk still carries a dut block and would fail the
// same way; it survives only because it ships a pre-generated target_database.h.
// The nRF targets, which are regenerated, have no dut block either.
